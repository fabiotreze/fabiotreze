name: Sync README sections

on:
  schedule:
    - cron: "0 6 * * *"  # diário 06h UTC (~03h BRT)
  workflow_dispatch:
  repository_dispatch:
    types: [readme-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync nossodireito About (English)
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/fabiotreze/nossodireito/main/README.md -o /tmp/src.md

          # Extrai conteúdo entre ABOUT-EN:START e ABOUT-EN:END (exclui marcadores)
          awk '/<!-- ABOUT-EN:START -->/,/<!-- ABOUT-EN:END -->/' /tmp/src.md \
            | sed '1d;$d' > /tmp/section.md

          if [[ ! -s /tmp/section.md ]]; then
            echo "::error::Seção ABOUT-EN vazia ou marcadores não encontrados no nossodireito/README.md"
            exit 1
          fi

          # Substitui entre NOSSODIREITO-ABOUT:START e :END no README local
          python3 <<'PY'
          import re, pathlib
          dst = pathlib.Path("readme.md") if pathlib.Path("readme.md").exists() else pathlib.Path("README.md")
          src = pathlib.Path("/tmp/section.md").read_text(encoding="utf-8")
          # Remove headers (###, ####...) — só queremos o paragrafo,
          # ja existe heading proprio no profile readme acima do marcador
          src = "\n".join(l for l in src.splitlines() if not l.lstrip().startswith("#")).strip()
          text = dst.read_text(encoding="utf-8")
          new = re.sub(
              r"(<!-- NOSSODIREITO-ABOUT:START -->)(.*?)(<!-- NOSSODIREITO-ABOUT:END -->)",
              lambda m: f"{m.group(1)}\n<!-- conteúdo sincronizado automaticamente do nossodireito/README.md — não edite manualmente -->\n{src}\n{m.group(3)}",
              text, flags=re.DOTALL,
          )
          if new != text:
              dst.write_text(new, encoding="utf-8")
              print(f"{dst} atualizado")
          else:
              print("Sem mudanças")
          PY

      - name: Commit se houver mudança
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(readme): sync About section from nossodireito"
            git push
          else
            echo "Nada a commitar."
          fi
